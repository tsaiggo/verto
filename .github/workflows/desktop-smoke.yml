name: Windows desktop smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-smoke.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/tauri-build-unsigned.mjs"
      - "src-tauri/**"
      - "tests/desktop/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-portability:
    name: Native quality and CAS tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Install Tauri Linux prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential
          curl
          file
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          wget

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check native formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lint native targets
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run native unit tests
        working-directory: src-tauri
        run: cargo test --locked

  windows:
    name: Package and exercise Windows desktop
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate desktop smoke configuration
        run: npm run test:desktop:config

      - name: Check native formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lint native targets
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run native unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build unsigned production package
        run: npm run package:local

      - name: Build isolated release binary for WebDriver
        run: npm run build:desktop:smoke

      - name: Install upstream Tauri WebDriver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Exercise the smoke-identified release binary
        run: npm run test:desktop
        env:
          VERTO_DESKTOP_APP_BINARY: ${{ github.workspace }}\src-tauri\target\desktop-smoke\release\verto.exe
          VERTO_DESKTOP_SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # The installer script repeats the same read/write/watcher WebDriver spec
      # against the exact executable registered by this MSI, then uninstalls
      # only that MSI's ProductCode.
      - name: Install, exercise, and uninstall the MSI
        shell: pwsh
        run: >-
          ./tests/desktop/scripts/install-launch-uninstall.ps1
          -LogDirectory test-results/desktop-installer

      - name: Upload desktop smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-smoke-logs
          path: |
            test-results/desktop-smoke/**
            test-results/desktop-installer/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verto-windows-unsigned-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
